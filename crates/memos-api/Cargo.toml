[package]
name = "memos-api"
description = "Generated Rust client for the Memos v0.30 API contract."
version = "0.30.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.97"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
publish = false

[lib]
doctest = false

[dev-dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread"] }

[dependencies]
bytes = "1.9"
chrono = { version = "0.4", default-features=false, features = ["serde"] }
futures-core = "0.3"
progenitor-client = "0.14.0"
reqwest = { version = "0.13", default-features=false, features = ["json", "multipart", "query", "rustls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
