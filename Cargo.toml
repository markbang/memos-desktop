[workspace]
members = ["crates/app", "crates/memos-api", "tools/openapi-normalizer"]
exclude = ["vendor/grid"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
authors = ["Mark Bang"]
repository = "https://github.com/markbang/memos-desktop"
homepage = "https://github.com/markbang/memos-desktop"

[patch.crates-io]
# GPUI 0.2.2 pins taffy 0.9.0, which pins grid 0.18.0. Keep the API
# compatible while backporting grid's upstream dimension-overflow fix.
grid = { path = "vendor/grid" }

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
directories = "6.0"
futures = "0.3"
gpui = "0.2.2"
gpui-component = "0.5.1"
gpui-component-assets = "0.5.1"
keyring = "4.1.6"
mime_guess = "2.0"
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
sha2 = "0.10"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "sync", "time"] }
url = { version = "2.5", features = ["serde"] }

[profile.dev]
codegen-units = 16
debug = "limited"
split-debuginfo = "unpacked"

[profile.dev.package.gpui]
opt-level = 3

[profile.dev.package.resvg]
opt-level = 3

[profile.dev.package.rustybuzz]
opt-level = 3

[profile.dev.package.taffy]
opt-level = 3

[profile.dev.package.ttf-parser]
opt-level = 3
